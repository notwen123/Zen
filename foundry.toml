[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }]
# Monad execution environment (Foundry >= 1.8): Monad gas model, opcode pricing, precompiles.
network = "monad"

[rpc_endpoints]
# Public endpoints from docs.monad.xyz (rate-limited). Override with your own provider if needed.
monad_testnet = "https://testnet-rpc.monad.xyz"
monad_mainnet = "https://rpc.monad.xyz"

[lint]
# Style kept consistent with the Wield codebase (camelCase immutables, plain keccak256).
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256", "mixed-case-function"]
# Lint production code only; tests/scripts intentionally cast string literals to bytes32.
ignore = ["test/**/*.sol", "script/**/*.sol"]

[fuzz]
runs = 1000

[invariant]
runs = 128
depth = 64
fail_on_revert = false
