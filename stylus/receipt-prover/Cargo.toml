[package]
name = "stockback-receipt-prover"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "STOCKBACK Ed25519 attestation verifier for Arbitrum Stylus"

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "0.10.9"
# no_std, no rand, no precomputed signing tables: verification only.
ed25519-dalek = { version = "2.2", default-features = false }

[dev-dependencies]
stylus-sdk = { version = "0.10.9", features = ["stylus-test"] }
serde_json = "1"

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "s"
