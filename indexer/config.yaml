# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Zen on Monad testnet: every claim, sale, refund, settlement and LP flow, indexed by Envio HyperIndex.
# Data source: HyperSync (https://10143.hypersync.xyz). Needs ENVIO_API_TOKEN in .env (free at envio.dev/app/api-tokens).
name: zen-indexer
description: Zen conditional equity claims, refunds and the instant-exit LP market on Monad
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: ReceiptCommitmentRegistry
    events:
      - event: "PurchaseCommitted(bytes32 indexed claimId, bytes32 indexed nullifier, address indexed claimant, bytes32 brandId, bytes32 merchantId, uint128 amount, bytes3 currency)"
      - event: "RewardAllocated(bytes32 indexed claimId, bytes32 indexed brandId, address indexed claimant, uint256 assets, uint256 positionId)"
  - name: ConditionalClaim
    events:
      - event: "ClaimMinted(uint256 indexed id, address indexed claimant, bytes32 indexed brandId, address equityToken, uint256 amount, uint8 category, uint64 unlockAt)"
      - event: "ClaimVoided(uint256 indexed id, address indexed holder, address indexed originalClaimant, uint256 amount)"
      - event: "ClaimSettled(uint256 indexed id, address indexed holder, uint256 amount)"
      - event: "Transfer(address indexed from, address indexed to, uint256 indexed tokenId)"
  - name: VoidOracle
    events:
      - event: "RefundAccepted(uint256 indexed claimId, bytes32 indexed refundRef, address indexed attester)"
  - name: InstantExitPool
    events:
      - event: "ClaimBought(uint256 indexed id, address indexed seller, uint256 amount, uint256 price)"
      - event: "ClaimResolved(uint256 indexed id, bool settled, uint256 cost, uint256 proceeds)"
      - event: "Deposit(address indexed sender, address indexed owner, uint256 assets, uint256 shares)"
      - event: "Withdraw(address indexed sender, address indexed receiver, address indexed owner, uint256 assets, uint256 shares)"
chains:
  - id: 10143 # Monad testnet
    start_block: 70765300 # just before DeployZen (deployments/10143.json)
    contracts:
      - name: ReceiptCommitmentRegistry
        address: "0x41d3E78DbF601fEAe80Be16778BC893C44d47917"
      - name: ConditionalClaim
        address: "0xa5881243DAFDebb756a107E5D67C4647463FF54C"
      - name: VoidOracle
        address: "0x9b3181e6Fd79017d4781Fbf5C335F97AaC2CA266"
      - name: InstantExitPool
        address:
          - "0x839968a1e28Ba5D605c602eC42d0e796D4614749"
          - "0x82F0727a82d838A3DD4fB4B85459d92C509D80e6"
          - "0x5704263f22029f93Ec555e2ecc26E4E4C5492e7a"
